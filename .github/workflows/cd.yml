name: CI/CD Pipeline
on:
  push:
    branches:
      - Full-stack-Influx-POC
  pull_request:
    branches:
      - Full-stack-Influx-POC

jobs:
  build-frontend:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install
      - name: Build frontend
        run: |
          cd frontend
          npm run build
      - name: Archive frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 7

  build-backend:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache backend dependencies
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-
      - name: Install backend dependencies
        run: |
          cd backend
          npm install
      - name: Archive backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/
          retention-days: 7

  deploy:
    needs: [build-frontend, build-backend]
    runs-on: self-hosted
    steps:
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          merge-multiple: true

      - name: Verify frontend build files
        run: |
          echo "Checking frontend build files:"
          ls -la frontend/build/
          echo "HTML file exists:"
          find frontend/build/ -name "index.html" | head -1

      - name: Deploy frontend to Nginx
        run: |
          echo "Deploying frontend files..."
          sudo cp -rf frontend/build/* /var/www/full_stack_vj_app_frontend/
          sudo chown -R www-data:www-data /var/www/full_stack_vj_app_frontend/
          sudo chmod -R 755 /var/www/full_stack_vj_app_frontend/

      - name: Configure Nginx for frontend and backend
        run: |
          # Create Nginx configuration
          sudo bash -c 'cat > /etc/nginx/sites-available/full_stack_vj_app << EOF
          server {
              listen 80;
              server_name _;  # Respond to all domains/IPs
              root /var/www/full_stack_vj_app_frontend;
              index index.html;

              # Serve frontend static files
              location / {
                  try_files \$uri \$uri/ /index.html;
              }

              # Cache static assets
              location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                  expires 1y;
                  add_header Cache-Control "public, immutable";
              }

              # Proxy API requests to backend (port 5296)
              location /api/ {
                  proxy_pass http://localhost:5296;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection \"upgrade\";
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  proxy_cache_bypass \$http_upgra
