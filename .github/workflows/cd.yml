---
name: CI/CD Pipeline
on:
  push:
    branches:
      - Full-stack-Influx-POC
  pull_request:
    branches:
      - Full-stack-Influx-POC
jobs:
  build-frontend:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install
      - name: copy .env files
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |

      - name: Build frontend
        run: |
          cd frontend
          npm run build
      - name: Archive frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 7
  build-backend:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache backend dependencies
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-
      - name: Install backend dependencies
        run: |
          cd backend
          npm install
      - name: Archive backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/
          retention-days: 7

  deploy:
    needs: [build-frontend, build-backend]
    runs-on: self-hosted
    steps:
      - name: Download a Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          merge-multiple: true

      - name: Serve with Nginx(Frontend)
        run: |
          rsync -av --delete frontend/build/ /var/www/full_stack_vj_app_frontend/
          systemctl reload nginx
          
      - name: Download backend-build
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: $HOME/full_stack_vj_app_/actions-runner/_work/fullstack-app/fullstack-app/backend

      - name: Serve with Nginx(Frontend)
        run: |
          sudo rsync -av --delete frontend/build/ /var/www/full_stack_vj_app_frontend/
          sudo systemctl reload nginx

      - name: Deploy with Local PM2
        run: |
          cd "$HOME/full_stack_vj_app_/actions-runner/_work/fullstack-app/fullstack-app/backend"

          if [ ! -d "node_modules/pm2" ]; then
            npm install pm2
          fi

          npx pm2 restart fullstack-backend || npx pm2 start server.js --name fullstack-backend

          npx pm2 status
