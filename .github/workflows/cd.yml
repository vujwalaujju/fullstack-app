name: CI/CD pipeline
on:
  push:
    branches:
      - Full-stack-Influx-POC
  pull_request:
    branches:
      - Full-stack-Influx-POC

jobs:
  build-frontend:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Create .env file
        run: |
          cd frontend
          echo "VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}" >> .env
          echo "VITE_FRONTEND_URL=${{ secrets.VITE_FRONTEND_URL }}" >> .env
          echo "VITE_INFLUX_URL=${{ secrets.VITE_INFLUX_URL }}" >> .env

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Archive frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 7

  build-backend:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache backend dependencies
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-
      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Archive backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/
          retention-days: 7

  docker-build-push:
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend (with .env)
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build

      - name: Download backend (with .env)
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend

      - name: Create frontend .env
        run: |
          echo "VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}" > frontend/.env
          echo "VITE_FRONTEND_URL=${{ secrets.VITE_FRONTEND_URL }}" >> frontend/.env
          echo "VITE_INFLUX_URL=${{ secrets.VITE_INFLUX_URL }}" >> frontend/.env

      - name: Create backend .env
        run: |
          cat > backend/.env << EOF
          INFLUX_URL=${{ secrets.INFLUX_URL }}
          INFLUX_TOKEN=${{ secrets.INFLUX_TOKEN }}
          INFLUX_ORG=${{ secrets.INFLUX_ORG }}
          INFLUX_BUCKET=${{ secrets.INFLUX_BUCKET }}
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Frontend-Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-frontend:latest

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Backend-Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-backend:latest

  docker-deploy:
    needs: docker-build-push
    runs-on: self-hosted
    environment: production
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      TAG: ${{ secrets.DEPLOY_TAG || 'latest' }}

    steps:
      - name: Checkout code (for docker-compose.yml)
        uses: actions/checkout@v4

      - name: Create deployment .env
        run: |
          cat > .env << EOF
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          TAG=${TAG}

          VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}
          VITE_FRONTEND_URL=${{ secrets.VITE_FRONTEND_URL }}
          VITE_INFLUX_URL=${{ secrets.VITE_INFLUX_URL }}

          INFLUX_URL=${{ secrets.INFLUX_URL }}
          INFLUX_TOKEN=${{ secrets.INFLUX_TOKEN }}
          INFLUX_ORG=${{ secrets.INFLUX_ORG }}
          INFLUX_BUCKET=${{ secrets.INFLUX_BUCKET }}
          EOF

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull & Deploy
        run: |
          echo "Deploying with tag: $TAG"
          docker compose --env-file .env pull
          docker compose --env-file .env up -d --remove-orphans

      - name: Show status
        run: |
          docker compose ps
          echo "Deployment successful!"
  deploy:
    needs: [build-frontend, build-backend]
    runs-on: self-hosted
    steps:
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          merge-multiple: true

      - name: Serve with Nginx (Frontend)
        run: |
          # Use sudo for rsync and nginx reload
          sudo rsync -av --delete --chown=www-data:www-data frontend/build/ /var/www/full_stack_vj_app_frontend/
          sudo systemctl reload nginx
          echo "Frontend deployed successfully"

      - name: Download backend build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: $HOME/full_stack_vj_app_/actions-runner/_work/fullstack-app/fullstack-app/backend

      - name: Deploy Backend with PM2
        run: |
          cd "$HOME/full_stack_vj_app_/actions-runner/_work/fullstack-app/fullstack-app/backend"
          [ ! -f .env ] && cat > .env << EOF
          INFLUX_URL=${{ secrets.INFLUX_URL }}
          INFLUX_TOKEN=${{ secrets.INFLUX_TOKEN }}
          INFLUX_ORG=${{ secrets.INFLUX_ORG }}
          INFLUX_BUCKET=${{ secrets.INFLUX_BUCKET }}
          EOF
          # Ensure PM2 is available
          if [ ! -d "node_modules/pm2" ]; then
            echo "Installing PM2..."
            npm install pm2
          fi

          # Restart or start the backend
          npx pm2 restart fullstack-backend || npx pm2 start server.js --name fullstack-backend

          # Save PM2 process list
          npx pm2 save

          # Show status
          npx pm2 status

          echo "Backend deployed successfully"
