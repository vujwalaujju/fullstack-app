name: CI/CD Pipeline
on:
  push:
    branches:
      - Full-stack-Influx-POC
  pull_request:
    branches:
      - Full-stack-Influx-POC

jobs:
  build-frontend:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - Check current user and permissions
        run: |
          echo "Current user: $(whoami)"
          echo "User ID: $(id)"
          echo "Working directory: $(pwd)"
          echo "Directory contents:"
          ls -la
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install
      - name: Build frontend
        run: |
          cd frontend
          npm run build
      - name: Archive frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 7

  build-backend:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache backend dependencies
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-
      - name: Install backend dependencies
        run: |
          cd backend
          npm install
      - name: Archive backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/
          retention-days: 7

  deploy:
    needs: [build-frontend, build-backend]
    runs-on: self-hosted
    steps:
      - name: Debug - Check deployment permissions
        run: |
          echo "Deployment user: $(whoami)"
          echo "Deployment user ID: $(id)"
          echo "Checking /var/www permissions:"
          sudo ls -la /var/www/ || echo "Cannot access /var/www"
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          merge-multiple: true

      - name: Serve with Nginx (Frontend)
        run: |
          echo "Copying frontend files to Nginx directory..."
          sudo cp -r frontend/build/* /var/www/full_stack_vj_app_frontend/ || echo "Copy failed, trying alternative method"
      - name: Alternative Nginx deployment - Method 2
        if: failure()
        run: |
          echo "Trying alternative deployment method..."
          TEMP_DIR="/tmp/frontend-deploy-$(date +%s)"
          mkdir -p $TEMP_DIR
          cp -r frontend/build/* $TEMP_DIR/
          sudo cp -r $TEMP_DIR/* /var/www/full_stack_vj_app_frontend/
          rm -rf $TEMP_DIR
          echo "Alternative method completed"
      - name: Set proper ownership for frontend files
        run: |
          echo "Setting proper ownership for frontend files..."
          sudo chown -R www-data:www-data /var/www/full_stack_vj_app_frontend/ || echo "Ownership change failed"
          sudo chmod -R 755 /var/www/full_stack_vj_app_frontend/ || echo "Permission change failed"
      - name: Reload Nginx
        run: |
          echo "Reloading Nginx configuration..."
